name: Docker Image CI

on:
  push:
    branches: ["main"]
  # pull_request:
  #   branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: hermeserm/polyvault
          tags: type=sha,prefix=

        #
      - name: Calculate Short SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
        #

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: . # Defines the build's context as the set of files located in the specified path
          file: ./Dockerfile
          push: true
          tags: hermeserm/polyvault:${{ steps.vars.outputs.sha_short }}
          labels: ${{ steps.meta.outputs.labels }}
